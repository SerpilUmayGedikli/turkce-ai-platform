# Türkçe AI Platformu - yerel geliştirme ortamı
# Başlat:  docker compose up -d --build
# 16 GB RAM için ayarlandı: yerel model olarak 7B civarı, 4-bit modeller kullan.

services:
  # 1) Model Gateway: tüm modellere (bulut + yerel) tek bir OpenAI uyumlu adres
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./gateway/config.yaml:/app/config.yaml:ro
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_API_BASE: http://ollama:11434
    ports:
      - "4000:4000"
    depends_on:
      - ollama
    restart: unless-stopped

  # 2) Yerel modeller (internetsiz, ücretsiz, veriler bilgisayardan çıkmaz)
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  # 3) Veritabanı + vektör araması: henüz kullanılmıyor (Text-to-SQL SQLite, RAG bellekte)
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped

  # 4) Bizim servisimiz: agent + API
  api:
    build: ./api
    env_file:
      - path: .env
        required: false
    environment:
      LLM_BASE_URL: http://litellm:4000
    ports:
      - "8000:8000"
    depends_on:
      - litellm
      - postgres
    restart: unless-stopped

volumes:
  ollama_data:
  pg_data:
